<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brezza · Accesso Daikin</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: radial-gradient(circle at 30% 20%, #1d3b63 0, #090b10 60%);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif; color: #eef2f8; }
  main { max-width: 520px; padding: 32px; text-align: center; }
  h1 { font-weight: 300; font-size: 34px; margin: 0 0 8px; }
  p { color: #9aa6b8; }
  button { margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 999px;
           background: #6ccbff; color: #06121f; font: 600 14px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Quasi fatto</h1>
  <p id="msg">Copia l'indirizzo di questa pagina e incollalo in Brezza.</p>
  <button id="copy">Copia indirizzo</button>
</main>
<script>
  const btn = document.getElementById('copy');
  const has = new URLSearchParams(location.search).has('code');
  if (!has) document.getElementById('msg').textContent = "In questo indirizzo manca il codice di Daikin: riprova il login da Brezza.";
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); btn.textContent = 'Copiato ✓'; }
    catch { btn.textContent = 'Copia dalla barra degli indirizzi'; }
  };
</script>
</body>
</html>
